<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1aa8d6"/>
      <stop offset="0.55" stop-color="#1088b8"/>
      <stop offset="1" stop-color="#0a4f74"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.2" r="0.8">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="keel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dff3fb"/>
      <stop offset="1" stop-color="#a6daef"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe066"/>
      <stop offset="1" stop-color="#ffb21e"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#04324a" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- tile -->
  <rect width="1024" height="1024" rx="228" fill="url(#bg)"/>
  <rect width="1024" height="1024" rx="228" fill="url(#glow)"/>

  <!-- speed lines -->
  <g stroke="#ffffff" stroke-linecap="round" fill="none" stroke-width="30">
    <line x1="182" y1="728" x2="310" y2="600" stroke-opacity="0.9"/>
    <line x1="270" y1="840" x2="378" y2="732" stroke-opacity="0.6"/>
    <line x1="160" y1="580" x2="222" y2="518" stroke-opacity="0.4"/>
  </g>

  <g filter="url(#shadow)" stroke-linejoin="round" stroke-width="18">
    <!-- paper plane: wing + keel -->
    <polygon points="820,200 220,452 470,560" fill="#ffffff" stroke="#ffffff"/>
    <polygon points="820,200 470,560 596,834" fill="url(#keel)" stroke="url(#keel)"/>
    <!-- lightning-bolt crease -->
    <path d="M813,207 L555,347 L654,345 L430,602 L730,419 L631,420 Z" fill="url(#bolt)" stroke="url(#bolt)" stroke-width="8"/>
  </g>
</svg>
